name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable-x86_64-unknown-linux-gnu
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnullvm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Install development toolchain
        env:
          CB_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install $env:CB_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:CB_TOOLCHAIN.EndsWith('windows-gnullvm')) {
            rustup component add rust-mingw --toolchain $env:CB_TOOLCHAIN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sysroot = rustc "+$env:CB_TOOLCHAIN" --print sysroot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-gnullvm/bin/rust-lld.exe'
            if (-not (Test-Path -LiteralPath $linker)) { throw 'rust-lld not found' }
            "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=$linker" >> $env:GITHUB_ENV
          }
      - name: Formatting
        env:
          CB_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$env:CB_TOOLCHAIN" fmt --all -- --check
      - name: Offline tests
        env:
          CB_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$env:CB_TOOLCHAIN" test --offline --locked
      - name: Clippy
        env:
          CB_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo "+$env:CB_TOOLCHAIN" clippy --offline --locked --all-targets -- -D warnings
